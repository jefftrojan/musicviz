<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music and Generative Visuals — Paired Study</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#f0f6fc;--muted:#9da7b3;--accent:#58c8ff;--accent2:#a371f7;--error:#ff7b72;--ok:#3fb950}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172436 0,#0d1117 42%);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1080px,100%);margin:auto;padding:24px 16px 72px}h1{font-size:clamp(1.45rem,3vw,2rem);line-height:1.2;margin:.2em 0 .6em}h2{font-size:1.15rem;margin:.2em 0 .8em}p{margin:.6em 0}.card{background:rgba(22,27,34,.97);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,30px);box-shadow:0 16px 50px #0005}.muted,.hint{color:var(--muted)}.hint{font-size:.92rem}.progress{height:6px;background:#21262d;border-radius:99px;margin:0 0 18px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}.clips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}.clip{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d1117}.clip h3{margin:0 0 8px}video{display:block;width:100%;max-height:42vh;border-radius:8px;background:#000}fieldset{min-width:0;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}legend{padding:0 6px;font-weight:650}.options{display:flex;flex-wrap:wrap;gap:8px}.options label{border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.options label:hover,.options label:focus-within{border-color:var(--accent)}.options input{margin-right:7px;accent-color:var(--accent)}.ratings{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:10px 7px;text-align:center;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}td label{display:inline-grid;place-items:center;width:34px;height:34px;cursor:pointer}input{accent-color:var(--accent)}textarea{width:100%;color:var(--fg);background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;min-height:70px;resize:vertical}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px}button{border:0;border-radius:9px;padding:11px 18px;font:700 1rem/1 system-ui;background:var(--accent);color:#07131a;cursor:pointer}button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}button.secondary{color:var(--fg);background:#21262d;border:1px solid var(--line)}.error{color:var(--error);min-height:1.5em;margin-top:10px}.success{color:var(--ok)}code{color:#d2a8ff}@media(max-width:720px){.clips{grid-template-columns:1fr}main{padding-top:14px}}
</style></head>
<body><main><div class="progress" aria-label="Study progress"><span id="progress"></span></div><div id="app" aria-live="polite"></div></main>
<script src="config.js"></script>
<script>
"use strict";
// Frozen matched-duration study stimuli use opaque public filenames.
const STUDY_ID="musicviz-causal-pairs-v1";
const PAIRS=[
 {pairId:"bg_calm_shift",backbone:"biggan",song:"calm_blue_lake",seed:0,controlType:"shifted",alignedUrl:"stimuli/s01.mp4",controlUrl:"stimuli/s02.mp4"},
 {pairId:"bg_shuffle",backbone:"biggan",song:"acoustic_shuffle",seed:1,controlType:"shuffled",alignedUrl:"stimuli/s03.mp4",controlUrl:"stimuli/s04.mp4"},
 {pairId:"sg_calm_random",backbone:"stylegan2",song:"calm_blue_lake",seed:0,controlType:"matched_random",alignedUrl:"stimuli/s05.mp4",controlUrl:"stimuli/s06.mp4"},
 {pairId:"sg_heavy_shift",backbone:"stylegan2",song:"heavy_drums_bass",seed:2,controlType:"shifted",alignedUrl:"stimuli/s07.mp4",controlUrl:"stimuli/s08.mp4"},
 {pairId:"sd_shuffle",backbone:"sd",song:"acoustic_shuffle",seed:1,controlType:"shuffled",alignedUrl:"stimuli/s09.mp4",controlUrl:"stimuli/s10.mp4"},
 {pairId:"sd_heavy_random",backbone:"sd",song:"heavy_drums_bass",seed:2,controlType:"matched_random",alignedUrl:"stimuli/s11.mp4",controlUrl:"stimuli/s12.mp4"}
];
const DIMENSIONS=[["sync","Synchronization with the music"],["smooth","Smoothness and stability"],["coherence","Visual coherence over time"],["appeal","Visual appeal"]];
const app=document.getElementById("app"),progress=document.getElementById("progress"),params=new URLSearchParams(location.search);
const participantId=params.get("pid")||cryptoId(),startedAt=Date.now(),pairOrder=shuffle(PAIRS.map((pair,index)=>({...pair,sourceIndex:index})));
pairOrder.forEach(pair=>{pair.alignedPosition=Math.random()<.5?"A":"B"});
const responses=[];let stage="consent",pairIndex=0,audioCheckPass=false,attentionPass=false,background={},submissionStatus="pending";
function cryptoId(){const bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("")}
function shuffle(values){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function esc(value){return String(value).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function setProgress(value){progress.style.width=`${Math.max(0,Math.min(1,value))*100}%`}
function error(message=""){const node=document.getElementById("error");if(node)node.textContent=message}
function checked(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||""}
function ratingTable(prefix){return`<div class="ratings"><table><thead><tr><th>Rating</th>${[1,2,3,4,5].map(n=>`<th>${n}</th>`).join("")}</tr></thead><tbody>${DIMENSIONS.map(([key,label])=>`<tr><td>${label}</td>${[1,2,3,4,5].map(n=>`<td><label aria-label="${esc(label)}, ${n} of 5"><input type="radio" name="${prefix}_${key}" value="${n}"></label></td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderConsent(){setProgress(0);app.innerHTML=`<section class="card"><h1>Music and generative visuals</h1><p>This 8–10 minute academic study asks you to compare six pairs of short music videos. We study whether visual movement follows the music.</p><p>Participation is voluntary and anonymous. You may stop at any time. Completed responses are sent to the research database. The study records a random participant code, your answers, response times, age range, and selected background categories; it does not request your name, email address, or account information.</p><p class="hint">Recruit only after ethics/IRB review and after replacing this with approved consent language.</p><fieldset><legend>Consent</legend><label><input type="checkbox" id="consent"> I am at least 18 and consent to participate.</label></fieldset><div class="actions"><button id="continue">Continue</button><button class="secondary" id="decline">Decline</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("continue").onclick=()=>{if(!document.getElementById("consent").checked)return error("Please confirm consent to continue.");stage="checks";render()};document.getElementById("decline").onclick=()=>{app.innerHTML=`<section class="card"><h1>Study closed</h1><p>No responses were saved.</p></section>`}}
function renderChecks(){setProgress(.05);app.innerHTML=`<section class="card"><h1>Sound and attention check</h1><p>Use headphones or speakers, set a comfortable volume, and make sure videos are not muted.</p><fieldset><legend>Audio setup</legend><label><input type="checkbox" id="audio"> I can hear audio and will keep sound on.</label></fieldset><fieldset><legend>Instruction check</legend><p>To show that you read this instruction, select <strong>Ready</strong>.</p><div class="options"><label><input type="radio" name="attention" value="review">Review</label><label><input type="radio" name="attention" value="ready">Ready</label><label><input type="radio" name="attention" value="skip">Skip</label></div></fieldset><p class="hint">You may replay clips. Judge timing, not which image style you prefer.</p><div class="actions"><button id="continue">Begin comparisons</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("continue").onclick=()=>{audioCheckPass=document.getElementById("audio").checked;attentionPass=checked("attention")==="ready";if(!audioCheckPass||!checked("attention"))return error("Complete both checks before continuing.");if(!attentionPass)return error("Please reread the instruction and select the requested response.");stage="pairs";render()}}
function renderPair(){const pair=pairOrder[pairIndex],aAligned=pair.alignedPosition==="A",urls={A:aAligned?pair.alignedUrl:pair.controlUrl,B:aAligned?pair.controlUrl:pair.alignedUrl},start=Date.now();setProgress(.1+.72*(pairIndex/pairOrder.length));app.innerHTML=`<section class="card"><p class="muted">Comparison ${pairIndex+1} of ${pairOrder.length}</p><h1>Which clip follows the music more closely?</h1><p class="hint">Both clips use the same music and generator settings. Play both with sound before answering.</p><div class="clips"><article class="clip"><h3>Clip A</h3><video id="videoA" controls playsinline preload="metadata" src="${esc(urls.A)}"></video></article><article class="clip"><h3>Clip B</h3><video id="videoB" controls playsinline preload="metadata" src="${esc(urls.B)}"></video></article></div><fieldset><legend>Which clip followed the music more closely?</legend><div class="options"><label><input type="radio" name="selected" value="A">Clip A</label><label><input type="radio" name="selected" value="B">Clip B</label><label><input type="radio" name="selected" value="no_difference">No difference</label></div></fieldset><fieldset><legend>Rate Clip A: 1 = very poor, 5 = excellent</legend>${ratingTable("A")}</fieldset><fieldset><legend>Rate Clip B: 1 = very poor, 5 = excellent</legend>${ratingTable("B")}</fieldset><label for="reason"><strong>Optional:</strong> What made one clip feel more synchronized?</label><textarea id="reason" maxlength="600"></textarea><div class="actions"><button id="next">Save and continue</button></div><div class="error" id="error" role="alert"></div></section>`;const played={A:false,B:false};for(const pos of["A","B"])document.getElementById(`video${pos}`).addEventListener("play",()=>{played[pos]=true});document.getElementById("next").onclick=()=>{const required=["selected",...DIMENSIONS.flatMap(([key])=>[`A_${key}`,`B_${key}`])],missing=required.filter(name=>!checked(name));if(!played.A||!played.B)return error("Please play both clips before answering.");if(missing.length)return error("Please answer the comparison and all eight ratings.");const selected=checked("selected"),row={participant_id:participantId,pair_id:pair.pairId,backbone:pair.backbone,song:pair.song,seed:pair.seed,control_type:pair.controlType,aligned_position:pair.alignedPosition,presentation_order:pairIndex+1,selected_clip:selected,aligned_selected:selected==="no_difference"?.5:(selected===pair.alignedPosition?1:0),attention_pass:attentionPass,audio_check_pass:audioCheckPass,response_time_seconds:Math.round((Date.now()-start)/1000),comment:document.getElementById("reason").value.trim()};for(const[key]of DIMENSIONS){const alignedPrefix=pair.alignedPosition,controlPrefix=alignedPrefix==="A"?"B":"A";row[`${key}_aligned`]=Number(checked(`${alignedPrefix}_${key}`));row[`${key}_control`]=Number(checked(`${controlPrefix}_${key}`))}responses.push(row);pairIndex++;if(pairIndex<pairOrder.length)renderPair();else{stage="background";render()}}}
function renderBackground(){setProgress(.86);app.innerHTML=`<section class="card"><h1>About you</h1><fieldset><legend>Age range</legend><div class="options">${["18–24","25–34","35–44","45–54","55+","Prefer not to say"].map(x=>`<label><input type="radio" name="age" value="${x}">${x}</label>`).join("")}</div></fieldset><fieldset><legend>Background (select any)</legend><div class="options">${["Music/audio","AI/machine learning","Visual design/video","None of these"].map(x=>`<label><input type="checkbox" name="experience" value="${x}">${x}</label>`).join("")}</div></fieldset><label for="final_comment"><strong>Optional:</strong> Anything else you noticed?</label><textarea id="final_comment" maxlength="800"></textarea><div class="actions"><button id="finish">Finish and submit responses</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("finish").onclick=async()=>{if(!checked("age"))return error("Please select an age range or ‘Prefer not to say.’");background={age_range:checked("age"),experience:[...document.querySelectorAll('input[name="experience"]:checked')].map(x=>x.value).join("|"),final_comment:document.getElementById("final_comment").value.trim()};const button=document.getElementById("finish");button.disabled=true;button.textContent="Submitting…";error("");await exportData();stage="done";render()}}
function csvEscape(value){return`"${String(value??"").replaceAll('"','""')}"`}
function buildRows(){const endedAt=Date.now();return responses.map(row=>({...row,...background,study_id:STUDY_ID,started_at:new Date(startedAt).toISOString(),ended_at:new Date(endedAt).toISOString(),total_duration_seconds:Math.round((endedAt-startedAt)/1000)}))}
function downloadBackup(rows){const columns=Object.keys(rows[0]),csv=[columns.map(csvEscape).join(","),...rows.map(row=>columns.map(key=>csvEscape(row[key])).join(","))].join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));link.download=`${STUDY_ID}_${participantId}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
async function exportData(){const rows=buildRows(),config=window.MUSICVIZ_DATA_API||{};window.__musicvizStudyData=rows;try{if(!config.url||!config.publishableKey)throw new Error("Online response storage is not configured.");const endpoint=`${config.url.replace(/\/$/,"")}/rest/v1/study_responses`,response=await fetch(endpoint,{method:"POST",headers:{apikey:config.publishableKey,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rows)});if(!response.ok)throw new Error(`Response storage returned ${response.status}.`);submissionStatus="online"}catch(reason){console.error(reason);downloadBackup(rows);submissionStatus="backup"}}
function renderDone(){setProgress(1);const receipt=submissionStatus==="online"?"Your anonymous responses were saved successfully. No file needs to be sent to the research team.":"The online submission could not be completed. A backup CSV was downloaded; please send that file to the research team.";app.innerHTML=`<section class="card"><h1 class="success">Study complete</h1><p>${receipt}</p><h2>Debrief</h2><p>Each pair used the same generator settings and audio. One video received correctly timed motion controls; the other received a shifted or reordered trace. We are testing whether that timing survives the generator and remains visible.</p><p class="hint">Participant ID: <code>${esc(participantId)}</code></p></section>`}
function render(){if(stage==="consent")renderConsent();else if(stage==="checks")renderChecks();else if(stage==="pairs")renderPair();else if(stage==="background")renderBackground();else renderDone();window.scrollTo({top:0,behavior:"instant"})}render();
</script></body></html>
