<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music and Generative Visuals — Paired Study</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--paper:#f4f1e8;--surface:#fffdf8;--ink:#171914;--muted:#666a60;--line:#d8d4c7;--accent:#e84b2c;--accent-dark:#a52d19;--soft:#ebe7da;--error:#b42318;--ok:#176b4d;--radius:4px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.site-head{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;height:64px;padding:0 max(20px,calc((100vw - 1120px)/2));background:color-mix(in srgb,var(--paper) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font:800 .82rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}.step-label{color:var(--muted);font-size:.84rem;text-align:right}.head-rule{height:2px;background:var(--line);overflow:hidden}.head-rule span{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}main{width:min(1120px,100%);margin:auto;padding:clamp(34px,6vw,72px) 20px 96px}h1{max-width:760px;font-size:clamp(2.15rem,5.4vw,4.7rem);font-weight:760;letter-spacing:-.055em;line-height:.98;margin:.12em 0 .36em}h2{font-size:clamp(1.2rem,2vw,1.55rem);letter-spacing:-.025em;line-height:1.2;margin:.2em 0 .8em}h3{margin:0;font-size:1rem}p{margin:.65em 0}.eyebrow{margin:0 0 18px;color:var(--accent-dark);font:750 .76rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}.lede{max-width:680px;color:#35382f;font-size:clamp(1.04rem,2vw,1.3rem);line-height:1.5}.card{background:transparent}.panel{margin:32px 0;padding:24px;background:var(--surface);border:1px solid var(--line);box-shadow:5px 5px 0 #dcd7c9}.notice{max-width:760px;margin:28px 0;padding:15px 17px;border-left:3px solid var(--accent);background:#fff7e9;color:#4b4335;font-size:.92rem}.muted,.hint{color:var(--muted)}.hint{font-size:.9rem}.study-meta{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.study-meta span,.status{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 9px;font:700 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.clips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px 0 34px}.clip{min-width:0;border:1px solid var(--ink);padding:10px;background:var(--surface);box-shadow:4px 4px 0 var(--ink);transition:transform .16s ease,box-shadow .16s ease}.clip.is-played{box-shadow:4px 4px 0 var(--ok)}.clip-head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 11px}.play-state{color:var(--muted);font:700 .68rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}.clip.is-played .play-state{color:var(--ok)}video{display:block;width:100%;aspect-ratio:1/1;max-height:56vh;object-fit:contain;background:#090a08}fieldset{min-width:0;border:1px solid var(--line);padding:18px;margin:18px 0;background:var(--surface)}legend{padding:0 8px 0 0;font-weight:760;letter-spacing:-.01em}.choice-block{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}.options{display:flex;flex-wrap:wrap;gap:9px}.options label{position:relative;display:inline-flex;min-height:44px;align-items:center;border:1px solid var(--line);background:#fff;padding:9px 13px;cursor:pointer;transition:border-color .15s,background .15s,color .15s}.options label:hover,.options label:focus-within{border-color:var(--ink)}.options label:has(input:checked){border-color:var(--ink);background:var(--ink);color:#fff}.options input{margin:0 8px 0 0;accent-color:var(--accent)}.ratings{overflow-x:auto;margin-top:5px}table{width:100%;border-collapse:collapse;min-width:570px}th,td{padding:11px 7px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--muted);font:700 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}th:first-child,td:first-child{text-align:left;width:42%}td:first-child{font-size:.92rem}td label{display:inline-grid;place-items:center;width:36px;height:36px;cursor:pointer}td label:has(input:checked){background:var(--ink);color:#fff}td input{width:17px;height:17px;margin:0;accent-color:var(--accent)}input{accent-color:var(--accent)}textarea{display:block;width:100%;margin-top:9px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:12px 13px;font:inherit;min-height:90px;resize:vertical}textarea:focus{border-color:var(--ink)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}button{min-height:46px;border:1px solid var(--ink);border-radius:0;padding:12px 18px;font:760 .94rem/1 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--ink);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--accent);transition:transform .12s,box-shadow .12s}button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--accent)}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent)}button:disabled{cursor:wait;opacity:.62}.secondary{color:var(--ink);background:transparent;box-shadow:none}.secondary:hover{box-shadow:3px 3px 0 var(--line)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.error{color:var(--error);font-weight:650;min-height:1.5em;margin-top:12px}.success{color:var(--ok)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:2px 5px}.divider{height:1px;background:var(--line);margin:32px 0}.fine-print{max-width:760px;color:var(--muted);font-size:.82rem}@media(max-width:720px){.site-head{grid-template-columns:auto 1fr;height:56px;padding:0 16px}.step-label{display:none}main{padding:34px 15px 72px}h1{font-size:clamp(2.35rem,13vw,3.5rem)}.clips{grid-template-columns:1fr;gap:22px}.panel{padding:18px;box-shadow:3px 3px 0 #dcd7c9}fieldset{padding:14px 12px}.options{display:grid;grid-template-columns:1fr}.options label{width:100%}table{min-width:520px}.actions{position:sticky;bottom:0;padding:13px 0 5px;background:linear-gradient(transparent,var(--paper) 18%)}button:not(.secondary){width:100%}}
</style></head>
<body><header class="site-head"><div class="brand">MVIZ / STUDY</div><div class="head-rule" aria-label="Study progress"><span id="progress"></span></div><div class="step-label" id="stepLabel">Welcome</div></header><main><div id="app" aria-live="polite"></div></main>
<script src="config.js"></script>
<script>
"use strict";
// Frozen matched-duration study stimuli use opaque public filenames.
const STUDY_ID="musicviz-causal-pairs-v1";
const PAIRS=[
 {pairId:"bg_calm_shift",backbone:"biggan",song:"calm_blue_lake",seed:0,controlType:"shifted",alignedUrl:"stimuli/s01.mp4",controlUrl:"stimuli/s02.mp4"},
 {pairId:"bg_shuffle",backbone:"biggan",song:"acoustic_shuffle",seed:1,controlType:"shuffled",alignedUrl:"stimuli/s03.mp4",controlUrl:"stimuli/s04.mp4"},
 {pairId:"sg_calm_random",backbone:"stylegan2",song:"calm_blue_lake",seed:0,controlType:"matched_random",alignedUrl:"stimuli/s05.mp4",controlUrl:"stimuli/s06.mp4"},
 {pairId:"sg_heavy_shift",backbone:"stylegan2",song:"heavy_drums_bass",seed:2,controlType:"shifted",alignedUrl:"stimuli/s07.mp4",controlUrl:"stimuli/s08.mp4"},
 {pairId:"sd_shuffle",backbone:"sd",song:"acoustic_shuffle",seed:1,controlType:"shuffled",alignedUrl:"stimuli/s09.mp4",controlUrl:"stimuli/s10.mp4"},
 {pairId:"sd_heavy_random",backbone:"sd",song:"heavy_drums_bass",seed:2,controlType:"matched_random",alignedUrl:"stimuli/s11.mp4",controlUrl:"stimuli/s12.mp4"}
];
const DIMENSIONS=[["sync","Synchronization with the music"],["smooth","Smoothness and stability"],["coherence","Visual coherence over time"],["appeal","Visual appeal"]];
const app=document.getElementById("app"),progress=document.getElementById("progress"),stepLabel=document.getElementById("stepLabel"),params=new URLSearchParams(location.search);
const participantId=params.get("pid")||cryptoId(),startedAt=Date.now(),pairOrder=shuffle(PAIRS.map((pair,index)=>({...pair,sourceIndex:index})));
pairOrder.forEach(pair=>{pair.alignedPosition=Math.random()<.5?"A":"B"});
const responses=[];let stage="consent",pairIndex=0,audioCheckPass=false,attentionPass=false,background={},submissionStatus="pending";
function cryptoId(){const bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("")}
function shuffle(values){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function esc(value){return String(value).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function setProgress(value,label=""){progress.style.width=`${Math.max(0,Math.min(1,value))*100}%`;if(label)stepLabel.textContent=label}
function error(message=""){const node=document.getElementById("error");if(node)node.textContent=message}
function checked(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||""}
function ratingTable(prefix){return`<div class="ratings"><table><thead><tr><th>Rating</th>${[1,2,3,4,5].map(n=>`<th>${n}</th>`).join("")}</tr></thead><tbody>${DIMENSIONS.map(([key,label])=>`<tr><td>${label}</td>${[1,2,3,4,5].map(n=>`<td><label aria-label="${esc(label)}, ${n} of 5"><input type="radio" name="${prefix}_${key}" value="${n}"></label></td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderConsent(){setProgress(0,"Welcome");app.innerHTML=`<section class="card"><p class="eyebrow">Listening study · about 8–10 minutes</p><h1>Can you see the rhythm?</h1><p class="lede">Compare six pairs of short generative videos and tell us which one moves more closely with the music.</p><div class="study-meta"><span>6 comparisons</span><span>Headphones recommended</span><span>Anonymous code</span></div><div class="panel"><h2>Before you take part</h2><p>Participation is voluntary. You may stop at any time. Completed responses are stored under a random participant code together with your answers, response times, age range, and selected background categories. We do not ask for your name, email address, or account information.</p><fieldset><legend>Your consent</legend><label><input type="checkbox" id="consent"> I am at least 18 and consent to participate.</label></fieldset></div><p class="notice">Research preview: recruit only after ethics/IRB review and replace this notice with the approved consent language.</p><div class="actions"><button id="continue">Start setup</button><button class="secondary" id="decline">I don’t want to participate</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("continue").onclick=()=>{if(!document.getElementById("consent").checked)return error("Please confirm consent before continuing.");stage="checks";render()};document.getElementById("decline").onclick=()=>{app.innerHTML=`<section class="card"><p class="eyebrow">Session ended</p><h1>Nothing was saved.</h1><p class="lede">You can close this page now.</p></section>`}}
function renderChecks(){setProgress(.06,"Sound check");app.innerHTML=`<section class="card"><p class="eyebrow">Quick setup</p><h1>Sound on. Distractions off.</h1><p class="lede">You’ll need to hear the music clearly. Use headphones if you can, and keep the same comfortable volume throughout.</p><div class="panel"><fieldset><legend>Audio</legend><label><input type="checkbox" id="audio"> I can hear audio and will keep sound on.</label></fieldset><fieldset><legend>Instruction check</legend><p>To confirm you read this, choose <strong>Ready</strong>.</p><div class="options"><label><input type="radio" name="attention" value="review">Review</label><label><input type="radio" name="attention" value="ready">Ready</label><label><input type="radio" name="attention" value="skip">Skip</label></div></fieldset></div><p class="notice"><strong>What to judge:</strong> the timing between the music and the visual movement—not which visual style you prefer. You may replay either clip.</p><div class="actions"><button id="continue">Begin the six comparisons</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("continue").onclick=()=>{audioCheckPass=document.getElementById("audio").checked;attentionPass=checked("attention")==="ready";if(!audioCheckPass||!checked("attention"))return error("Complete both checks before continuing.");if(!attentionPass)return error("Read the instruction again and choose Ready.");stage="pairs";render()}}
function renderPair(){const pair=pairOrder[pairIndex],aAligned=pair.alignedPosition==="A",urls={A:aAligned?pair.alignedUrl:pair.controlUrl,B:aAligned?pair.controlUrl:pair.alignedUrl},start=Date.now();setProgress(.12+.7*((pairIndex+1)/pairOrder.length),`Comparison ${pairIndex+1} / ${pairOrder.length}`);app.innerHTML=`<section class="card"><p class="eyebrow">Comparison ${pairIndex+1} of ${pairOrder.length}</p><h1>Which clip moves with the music?</h1><p class="lede">Play both clips with sound. Focus on the timing of the movement, then make your choice and rate each clip.</p><div class="clips"><article class="clip" data-clip="A"><div class="clip-head"><h3>Clip A</h3><span class="play-state">Not played</span></div><video id="videoA" controls playsinline preload="metadata" src="${esc(urls.A)}"></video></article><article class="clip" data-clip="B"><div class="clip-head"><h3>Clip B</h3><span class="play-state">Not played</span></div><video id="videoB" controls playsinline preload="metadata" src="${esc(urls.B)}"></video></article></div><fieldset class="choice-block"><legend>Your choice</legend><p>Which clip followed the music more closely?</p><div class="options"><label><input type="radio" name="selected" value="A">Clip A</label><label><input type="radio" name="selected" value="B">Clip B</label><label><input type="radio" name="selected" value="no_difference">No clear difference</label></div></fieldset><div class="divider"></div><h2>Rate each clip</h2><p class="hint">1 means very poor; 5 means excellent.</p><fieldset><legend>Clip A</legend>${ratingTable("A")}</fieldset><fieldset><legend>Clip B</legend>${ratingTable("B")}</fieldset><label for="reason"><strong>Optional:</strong> What affected your synchronization judgment?</label><textarea id="reason" maxlength="600" placeholder="A brief note, if anything stood out…"></textarea><div class="actions"><button id="next">Save comparison ${pairIndex+1}</button></div><div class="error" id="error" role="alert"></div></section>`;const played={A:false,B:false};for(const pos of["A","B"])document.getElementById(`video${pos}`).addEventListener("play",()=>{played[pos]=true;const clip=document.querySelector(`[data-clip="${pos}"]`);clip.classList.add("is-played");clip.querySelector(".play-state").textContent="Played"});document.getElementById("next").onclick=()=>{const required=["selected",...DIMENSIONS.flatMap(([key])=>[`A_${key}`,`B_${key}`])],missing=required.filter(name=>!checked(name));if(!played.A||!played.B)return error("Play both clips before answering.");if(missing.length)return error("Choose a clip and complete all eight ratings.");const selected=checked("selected"),row={participant_id:participantId,pair_id:pair.pairId,backbone:pair.backbone,song:pair.song,seed:pair.seed,control_type:pair.controlType,aligned_position:pair.alignedPosition,presentation_order:pairIndex+1,selected_clip:selected,aligned_selected:selected==="no_difference"?.5:(selected===pair.alignedPosition?1:0),attention_pass:attentionPass,audio_check_pass:audioCheckPass,response_time_seconds:Math.round((Date.now()-start)/1000),comment:document.getElementById("reason").value.trim()};for(const[key]of DIMENSIONS){const alignedPrefix=pair.alignedPosition,controlPrefix=alignedPrefix==="A"?"B":"A";row[`${key}_aligned`]=Number(checked(`${alignedPrefix}_${key}`));row[`${key}_control`]=Number(checked(`${controlPrefix}_${key}`))}responses.push(row);pairIndex++;if(pairIndex<pairOrder.length)renderPair();else{stage="background";render()}}}
function renderBackground(){setProgress(.92,"Final questions");app.innerHTML=`<section class="card"><p class="eyebrow">Almost finished</p><h1>A little context.</h1><p class="lede">These final questions help us understand the mix of people who took part.</p><div class="panel"><fieldset><legend>Age range</legend><div class="options">${["18–24","25–34","35–44","45–54","55+","Prefer not to say"].map(x=>`<label><input type="radio" name="age" value="${x}">${x}</label>`).join("")}</div></fieldset><fieldset><legend>Relevant background <span class="hint">(choose any)</span></legend><div class="options">${["Music/audio","AI/machine learning","Visual design/video","None of these"].map(x=>`<label><input type="checkbox" name="experience" value="${x}">${x}</label>`).join("")}</div></fieldset><label for="final_comment"><strong>Optional:</strong> Is there anything else you noticed?</label><textarea id="final_comment" maxlength="800" placeholder="Your final note…"></textarea></div><div class="actions"><button id="finish">Submit my responses</button></div><div class="error" id="error" role="alert"></div></section>`;document.getElementById("finish").onclick=async()=>{if(!checked("age"))return error("Choose an age range or Prefer not to say.");background={age_range:checked("age"),experience:[...document.querySelectorAll('input[name="experience"]:checked')].map(x=>x.value).join("|"),final_comment:document.getElementById("final_comment").value.trim()};const button=document.getElementById("finish");button.disabled=true;button.textContent="Submitting…";error("");await exportData();stage="done";render()}}
function csvEscape(value){return`"${String(value??"").replaceAll('"','""')}"`}
function buildRows(){const endedAt=Date.now();return responses.map(row=>({...row,...background,study_id:STUDY_ID,started_at:new Date(startedAt).toISOString(),ended_at:new Date(endedAt).toISOString(),total_duration_seconds:Math.round((endedAt-startedAt)/1000)}))}
function downloadBackup(rows){const columns=Object.keys(rows[0]),csv=[columns.map(csvEscape).join(","),...rows.map(row=>columns.map(key=>csvEscape(row[key])).join(","))].join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));link.download=`${STUDY_ID}_${participantId}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
async function exportData(){const rows=buildRows(),config=window.MUSICVIZ_DATA_API||{};window.__musicvizStudyData=rows;try{if(!config.url||!config.publishableKey)throw new Error("Online response storage is not configured.");const endpoint=`${config.url.replace(/\/$/,"")}/rest/v1/study_responses`,response=await fetch(endpoint,{method:"POST",headers:{apikey:config.publishableKey,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rows)});if(!response.ok)throw new Error(`Response storage returned ${response.status}.`);submissionStatus="online"}catch(reason){console.error(reason);downloadBackup(rows);submissionStatus="backup"}}
function renderDone(){setProgress(1,"Complete");const receipt=submissionStatus==="online"?"Your responses were saved. There is nothing else to send.":"The online submission did not complete, so a backup CSV was downloaded. Please send that file to the research team.";app.innerHTML=`<section class="card"><p class="eyebrow success">Response received</p><h1>Thank you for listening closely.</h1><p class="lede">${receipt}</p><div class="panel"><h2>What we were testing</h2><p>Each pair used the same music and generator settings. One clip received correctly timed motion controls; the other received a shifted or reordered trace. We want to know whether that timing survives the generator and remains visible.</p></div><p class="fine-print">Participant code: <code>${esc(participantId)}</code></p></section>`}
function render(){if(stage==="consent")renderConsent();else if(stage==="checks")renderChecks();else if(stage==="pairs")renderPair();else if(stage==="background")renderBackground();else renderDone();window.scrollTo({top:0,behavior:"instant"})}render();
</script></body></html>
